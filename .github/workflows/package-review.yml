name: Build and package review copy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build requirements
        run: python -m pip install -r requirements.txt
      - name: Build five-page proposal
        run: python scripts/build_proposal.py
      - name: Validate source and PDF
        run: python scripts/validate.py
      - name: Build README-powered Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Retain complete review package
        uses: actions/upload-artifact@v4
        with:
          name: r2r-complete-review-package
          include-hidden-files: true
          path: |
            README.md
            _config.yml
            index.md
            _layouts/
            assets/
            proposal/
            resources/
            SOURCES.md
            MAINTAINING.md
            requirements.txt
            scripts/
            _site/
