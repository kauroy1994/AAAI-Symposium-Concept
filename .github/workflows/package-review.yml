name: Build and package review copy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build requirements
        run: python -m pip install -r requirements.txt
      - name: Apply audited program arithmetic and table spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['README.md', 'proposal/proposal.md', 'SOURCES.md', 'scripts/validate.py']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('510 of 840', '570 of 840').replace('approximately 61%', 'approximately 68%')
              text = text.replace('510/840', '570/840').replace('Monday 150, Tuesday 210, and Wednesday 150', 'Monday 150, Tuesday 240, and Wednesday 180')
              text = text.replace('150 + 210 + 150 == 510', '150 + 240 + 180 == 570')
              p.write_text(text, encoding='utf-8')
          p = Path('scripts/build_proposal.py')
          text = p.read_text().replace("('TOPPADDING',(0,0),(-1,-1),4)", "('TOPPADDING',(0,0),(-1,-1),3)").replace("('BOTTOMPADDING',(0,0),(-1,-1),4)", "('BOTTOMPADDING',(0,0),(-1,-1),3)")
          p.write_text(text)
          PY
      - name: Build proposal
        id: pdf
        run: python scripts/build_proposal.py
      - name: Validate source and PDF
        run: python scripts/validate.py
      - name: Build README-powered Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Commit audited source and generated proposal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md proposal/proposal.md SOURCES.md scripts/validate.py scripts/build_proposal.py proposal/proposal.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Correct program arithmetic and publish five-page proposal PDF'
            git push origin HEAD:main
          fi
      - name: Diagnose pagination
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          for path in Path('proposal').glob('*.pdf'):
              reader = PdfReader(path)
              print(path, len(reader.pages), 'pages')
              for i, page in enumerate(reader.pages, 1):
                  text = page.extract_text() or ''
                  print('PAGE', i, 'WORDS', len(text.split()), 'START:', text[:250], 'END:', text[-250:])
          PY
      - name: Retain complete review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2r-complete-review-package
          include-hidden-files: true
          path: |
            README.md
            _config.yml
            index.md
            _layouts/
            assets/
            proposal/
            resources/
            SOURCES.md
            MAINTAINING.md
            requirements.txt
            scripts/
            _site/
